<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bhai Harpreet Singh ji — Kirtan Archive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-link">&larr; Back to archive</a>

    <header class="site-header">
      <h1 class="page-heading">Bhai Harpreet Singh ji</h1>
    </header>

    <main>
      <section class="recording-player" data-recording-player>
        <p class="now-playing-label">Now playing</p>
        <h2 class="now-playing-title" data-current-title aria-live="polite">
          Choose a recording
        </h2>

        <audio controls preload="none" data-audio-player>
          Your browser does not support audio playback.
        </audio>

        <h2 id="harpreet-recordings-heading" class="recordings-heading">Recordings</h2>

        <ul class="recordings" aria-labelledby="harpreet-recordings-heading">

          <!--
            TO ADD A NEW RECORDING:
            1. Copy one of the <li> blocks below
            2. Paste it into this list
            3. Update the title text and the public S3 URL in href
          -->

          <li>
            <a
              class="recording-link"
              href="https://kirtan-audio.s3.us-east-2.amazonaws.com/harpreet/Bhai-Harpreet-Singh-Ji-Aad-Sate-Jugaad-Sate.mp3"
            >
              Aad Sate Jugaad Sate
            </a>
          </li>

        </ul>
      </section>
    </main>

    <footer class="site-footer">
      <p>Waheguru ji ka Khalsa, Waheguru ji ki Fateh</p>
    </footer>
  </div>

  <script src="recordings.js"></script>

</html>
